# Project configuration read by the Taskfiles and by `wails3 dev`.
# After changing `info`, run `wails3 task common:update:build-assets` to
# re-render build/darwin/Info*.plist, build/windows/info.json and the Windows
# manifest from it; scripts/prepare-release.sh does both on a version bump.
version: '3'

info:
  companyName: "bitjungle"
  productName: "GoCSV - GoPCA CSV Editor"
  productIdentifier: "com.bitjungle.gocsv"
  description: "Data Editor for GoPCA"
  copyright: "Copyright © 2025 bitjungle"
  comments: "Data Editor for GoPCA"
  version: "1.7.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
      - build/bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown

fileAssociations:
