name: Build and Test

# Workflow triggers are optimized to prevent duplicate runs:
# - Push events: Direct pushes to main and develop branches
# - Pull requests: All PRs targeting main or develop branches
# - This prevents double runs when pushing to a feature branch with an open PR
on:
  push:
    branches: [ main, develop ]  # Run on pushes to main and develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main, develop ]  # Run on PRs to main and develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:  # Allow manual triggering

env:
  GO_VERSION: '1.26'

# Restrict all jobs to read-only repository access by default.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # Continue running other jobs even if one fails
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Configure Git line endings
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    
    - name: Download Go dependencies
      run: go mod download

    - name: Verify go.mod is tidy
      run: |
        go mod tidy
        git diff --exit-code -- go.mod go.sum
    
    - name: Set up Python for validation
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        
    - name: Cache Python dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('testdata/validation/*.py') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Generate sklearn validation references
      run: |
        cd testdata
        python -m venv .venv
        
        # Activate virtual environment based on OS
        if [ "$RUNNER_OS" == "Windows" ]; then
          source .venv/Scripts/activate
        else
          source .venv/bin/activate
        fi
        
        # Install required packages
        python -m pip install --upgrade pip
        pip install numpy pandas scikit-learn scipy
        
        # Generate reference results
        cd validation
        echo "Generating PCA reference results..."
        python generate_reference_pca.py
        
        echo "Generating PCR reference results..."
        python generate_reference_pcr.py

        echo "Generating Student-t reference results..."
        python generate_studentt_reference.py

        echo "Generating Kernel PCA reference results..."
        python generate_kernel_pca_reference.py

        echo "Generating CLR reference results..."
        python generate_clr_reference.py

        echo "Generating power transform reference results..."
        python generate_power_transform_reference.py

        echo "Generating Savitzky-Golay reference results..."
        python generate_savgol_reference.py
        
        # Temporal PCA references are generated on every platform.
        #
        # This step used to be skipped on Windows with the note "issues with some
        # dependencies". The generator imports numpy, pandas and scipy, and scipy
        # was only added to the pip line in #844 -- so the note most likely
        # recorded a missing dependency rather than a Windows incompatibility, and
        # stopped being true without anyone revisiting it.
        #
        # It matters now: TestValidateTemporalPCAAgainstReference fails rather
        # than skips when its references are absent, so Windows either generates
        # them or loses that test entirely (#845).
        echo "Generating Temporal PCA reference results..."
        python generate_temporal_pca_reference.py
        
        # List generated files for verification. No pipe to head: GitHub runs
        # `shell: bash` with -o pipefail, so once there are more files than head
        # consumes, ls takes SIGPIPE and the whole step fails on a progress
        # message. That was latent until the PCR references pushed the count
        # past ten.
        echo "Generated reference files:"
        ls -1 reference_results/
      shell: bash
      env:
        # The generators print progress with characters outside cp1252, which is
        # what Python picks for stdout on a Windows runner. Without this the
        # Student-t generator dies on a U+2192 in a progress line and takes the
        # whole job with it -- a console encoding deciding whether the build
        # passes. Forcing UTF-8 output makes that impossible for every generator
        # rather than for the two that happen to contain such a character today.
        PYTHONIOENCODING: utf-8
    
    - name: Run tests
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          # Create minimal frontend/dist directories for Wails apps (avoids embed errors)
          mkdir -p cmd/gopca-desktop/frontend/dist
          echo '<!DOCTYPE html><html><body>Test</body></html>' > cmd/gopca-desktop/frontend/dist/index.html
          mkdir -p cmd/gocsv/frontend/dist
          echo '<!DOCTYPE html><html><body>Test</body></html>' > cmd/gocsv/frontend/dist/index.html
          
          # Derive the package list, exactly as scripts/ci/test-core.sh does for
          # the other platforms. Windows cannot simply call `make ci-test`, so it
          # carried a hand-written list instead -- and that list had fallen a long
          # way behind: pkg/csv, pkg/validation, pkg/transform, pkg/security,
          # internal/crossval and eight more were tested on Linux and macOS but
          # not here. CSV parsing is the most platform-sensitive code in the
          # project, and Windows was the one platform not running its tests.
          #
          # The old comment justified the hand-written list as avoiding "Windows
          # issues with packages without tests". Selecting only packages that
          # have test files is precisely what removes that problem, so the
          # property is now enforced rather than remembered.
          #
          # node_modules is excluded by path: flatted ships a Go implementation
          # inside this module's tree, so `go list ./...` descends into it.
          WIN_PACKAGES=$(go list -f '{{if or .TestGoFiles .XTestGoFiles}}{{.ImportPath}}{{end}}' ./... \
              | grep -v '/node_modules/' \
              | grep -v '/internal/utils$' \
              | tr '\n' ' ')
          echo "Testing $(echo "$WIN_PACKAGES" | wc -w) packages:"
          echo "$WIN_PACKAGES" | tr ' ' '\n' | sed '/^$/d'

          # internal/utils is run separately below, because one of its tests
          # asserts Unix path behaviour and is skipped here.
          go test -v -race -timeout 10m $WIN_PACKAGES
          
          # Run sklearn validation tests if reference files exist
          if [ -d "testdata/validation/reference_results" ]; then
            echo "Running sklearn validation tests..."
            go test -v -timeout 10m ./internal/core -run "TestValidate|TestNIPALS|TestMath"
          fi
          go test -v -race -timeout 10m -skip "TestValidateOutputPath" ./internal/utils
          # Run the full GoCSV module suite (separate module; headless tests — #751)
          cd cmd/gocsv && go test -v -race -timeout 10m ./... && cd ../..
        else
          make ci-test
        fi
      shell: bash
      env:
        GOPCA_TEST_TIMEOUT: 10m
    
    - name: Run linter
      run: |
        echo "Checking code formatting..."
        
        # Use gofmt -l to list files that need formatting
        NEED_FORMAT=""
        for dir in internal pkg cmd/gopca-cli; do
          if [ -d "$dir" ]; then
            output=$(gofmt -l "$dir" 2>/dev/null || true)
            if [ -n "$output" ]; then
              NEED_FORMAT="${NEED_FORMAT}${output}\n"
            fi
          fi
        done
        
        if [ -n "$NEED_FORMAT" ]; then
          echo "ERROR: The following files need formatting:"
          echo -e "$NEED_FORMAT"
          echo ""
          echo "Run 'go fmt ./...' locally to fix formatting."
          exit 1
        else
          echo "✓ All files are properly formatted"
        fi
        
        echo ""
        echo "Running go vet..."
        go vet ./internal/... ./pkg/...
        
        echo ""
        echo "Checking for inefficient assignments..."
        if command -v ineffassign &> /dev/null; then
          ineffassign ./...
        else
          echo "ineffassign not found, skipping"
        fi
      shell: bash
    
    - name: Build pca CLI for integration tests
      run: |
        echo "Building CLI for integration tests..."
        make build
      shell: bash
    
    - name: Run integration tests
      run: |
        echo "Running integration tests..."
        make test-e2e
      shell: bash
      env:
        GOPCA_TEST_TIMEOUT: 60

  frontend-lint:
    name: Frontend Lint and Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies (monorepo)
      run: npm ci

    # Both apps' frontend/wailsjs/ are gitignored and generated at build time,
    # so the type check below needs Go and the Wails CLI to produce the
    # declarations tsc resolves the `wailsjs` imports against.
    - name: Set up Go (for Wails binding generation)
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Install Wails CLI
      run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

    # Type-check every frontend.
    #
    # Nothing in this job did, and nothing else in a pull request did either.
    # eslint does not type-check, and `vitest run` transpiles with esbuild,
    # which strips types without checking them. The only step that ran tsc was
    # `npm run build` inside the Build jobs -- and those are gated on a push to
    # main or develop, so they are skipped on every pull request.
    #
    # A type error could therefore pass a completely green PR and only appear
    # when a developer ran `make pca-dev`, which is exactly what happened:
    # variancePercent.test.ts read a property off a value cast to `never` and
    # broke the GoPCA Desktop build for everyone until it was noticed by hand.
    #
    # This calls the same script `make typecheck` does, deliberately. The first
    # version of this step was written inline here, passed locally, and failed
    # on the runner, because the two environments differed in a way the YAML did
    # not describe. One entry point means a local pass is evidence about CI.
    - name: Type-check all frontends
      run: make typecheck

    # After the type check, not before: `make typecheck` builds the shared UI
    # package, and eslint is type-aware here (.eslintrc.json sets
    # parserOptions.project), so it wants those declarations present. Running it
    # in this order means the package is built once rather than by both steps,
    # and a type error is reported before the lint noise it usually causes.
    - name: Lint shared UI components
      run: npm run lint -w @gopca/ui-components

    - name: Lint GoPCA Desktop frontend
      run: npm run lint -w frontend

    - name: Lint GoCSV frontend
      run: npm run lint -w gocsv-frontend

    # Until this step existed, the frontend test suites ran only on developer
    # machines: CI linted the TypeScript and never executed a single vitest
    # case. Every guard written for the desktop UI was therefore unenforced on
    # pull requests, which is the same failure as a package missing from
    # scripts/ci/test-core.sh -- green for a reason unrelated to the tests.
    #
    # gocsv-frontend joined this list in #1002. Until then it had no test setup
    # at all, which is how its transform dialog came to report "Transformation
    # Results" for a transform that had refused to act: the rule deciding what
    # the dialog says was only ever read, never run.
    - name: Test shared UI components
      run: npm run test -w @gopca/ui-components

    - name: Test GoPCA Desktop frontend
      run: npm run test -w frontend

    - name: Test GoCSV frontend
      run: npm run test -w gocsv-frontend

  build-cli:
    name: Build pca CLI
    needs: test
    if: ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    # Fallback: runs-on: ubuntu-latest  # Use if self-hosted runner unavailable
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Configure Git line endings
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    
    - name: Build all platforms
      run: make ci-build-cli
    
    - name: Upload pca CLI artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pca-binaries
        path: build/pca-*
        retention-days: 7

  build-desktop:
    name: Build GoPCA Desktop
    needs: test
    if: ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false  # Continue building other platforms even if one fails
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: darwin
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Configure Git line endings
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: package-lock.json
    
    - name: Install Wails
      # Pinned to the library version in go.mod. The CLI and the library are
      # separate things and the CLI rewrites go.mod to match itself, so an
      # unpinned CLI would build releases against a version nobody chose.
      run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
    
    - name: Install Linux dependencies
      if: matrix.os == 'ubuntu-latest'
      run: ./scripts/ci/install-linux-deps.sh
    
    - name: Install all dependencies (monorepo)
      run: |
        # Install from root to get all workspace dependencies
        npm ci
    
    - name: Build shared UI components
      run: |
        # Build the shared components that both apps depend on
        npm run build-ui
    
    - name: Build GoPCA Desktop
      run: PLATFORM=${{ matrix.platform }} ./scripts/ci/build-desktop.sh
      shell: bash
    
    - name: Sign GoPCA Desktop (macOS)
      if: matrix.os == 'macos-latest'
      env:
        APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
      run: |
        ./scripts/ci/sign-macos-ci.sh cmd/gopca-desktop/build/bin/GoPCA.app
      shell: bash
    
    - name: Notarize GoPCA Desktop (macOS)
      if: matrix.os == 'macos-latest'
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        ./scripts/ci/notarize-macos-ci.sh cmd/gopca-desktop/build/bin/GoPCA.app
      shell: bash
    
    - name: Upload GoPCA artifacts
      uses: actions/upload-artifact@v4
      with:
        name: gopca-desktop-${{ matrix.platform }}
        path: |
          cmd/gopca-desktop/build/bin/*
          !cmd/gopca-desktop/build/bin/*.pdb
          !cmd/gopca-desktop/build/bin/*.ilk
        retention-days: 7

  build-gocsv:
    name: Build GoCSV Desktop
    needs: test
    if: ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false  # Continue building other platforms even if one fails
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: darwin
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Configure Git line endings
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: package-lock.json
    
    - name: Install Wails
      # Pinned to the library version in go.mod. The CLI and the library are
      # separate things and the CLI rewrites go.mod to match itself, so an
      # unpinned CLI would build releases against a version nobody chose.
      run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
    
    - name: Install Linux dependencies
      if: matrix.os == 'ubuntu-latest'
      run: ./scripts/ci/install-linux-deps.sh
    
    - name: Install all dependencies (monorepo)
      run: |
        # Install from root to get all workspace dependencies
        npm ci
    
    - name: Build shared UI components
      run: |
        # Build the shared components that both apps depend on
        npm run build-ui
    
    - name: Build GoCSV Desktop
      run: PLATFORM=${{ matrix.platform }} APPNAME=gocsv ./scripts/ci/build-gocsv.sh
      shell: bash
    
    - name: Sign GoCSV Desktop (macOS)
      if: matrix.os == 'macos-latest'
      env:
        APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
      run: |
        ./scripts/ci/sign-macos-ci.sh cmd/gocsv/build/bin/GoCSV.app
      shell: bash
    
    - name: Notarize GoCSV Desktop (macOS)
      if: matrix.os == 'macos-latest'
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        ./scripts/ci/notarize-macos-ci.sh cmd/gocsv/build/bin/GoCSV.app
      shell: bash
    
    - name: Package macOS GoCSV app for artifact upload
      if: matrix.os == 'macos-latest'
      run: |
        cd cmd/gocsv/build/bin
        # Use tar to preserve symlinks and attributes
        tar -czf GoCSV.app.tar.gz GoCSV.app
        cd -
      shell: bash
    
    - name: Upload GoCSV Desktop artifacts
      uses: actions/upload-artifact@v4
      with:
        name: gocsv-${{ matrix.platform }}
        path: |
          cmd/gocsv/build/bin/*
          !cmd/gocsv/build/bin/*.pdb
          !cmd/gocsv/build/bin/*.ilk
          !cmd/gocsv/build/bin/GoCSV.app
        retention-days: 7
    
    - name: Upload macOS GoCSV Desktop bundle
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: gocsv-${{ matrix.platform }}-app
        path: cmd/gocsv/build/bin/GoCSV.app.tar.gz
        retention-days: 7