name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Allow manual testing
    inputs:
      test_version:
        description: 'Test version for installer (e.g., v0.9.5-test)'
        required: false
        default: 'v0.9.5-test'
        type: string

env:
  GO_VERSION: '1.26'
  # Releases are published to the PUBLIC distribution repository, never to this
  # one. See the guard in the create-release job for why this is load-bearing
  # and not merely tidy.
  PUBLIC_RELEASE_REPO: 'bitjungle/gopca'

permissions:
  contents: write

jobs:
  build-cli-binaries:
    name: Build pca CLI - ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            runner: macos-latest
          - goos: darwin
            goarch: arm64
            runner: macos-latest
          - goos: linux
            goarch: amd64
            runner: self-hosted
          - goos: linux
            goarch: arm64
            runner: self-hosted
          - goos: windows
            goarch: amd64
            runner: self-hosted
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: Get version from tag or input
      id: get_version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.test_version }}"
          echo "Using test version: $VERSION"
        else
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "Using tag version: $VERSION"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
    
    - name: Build binary
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        VERSION: ${{ steps.get_version.outputs.version }}
      run: |
        BINARY_NAME="pca-${GOOS}-${GOARCH}"
        if [ "$GOOS" = "windows" ]; then
          BINARY_NAME="${BINARY_NAME}.exe"
        fi
        
        # Build with version information
        mkdir -p build
        go build -ldflags="-s -w \
          -X github.com/bitjungle/gopca/internal/version.Version=${VERSION} \
          -X github.com/bitjungle/gopca/internal/version.GitCommit=$(git rev-parse --short HEAD) \
          -X github.com/bitjungle/gopca/internal/version.BuildDate=$(date -u +\"%Y-%m-%dT%H:%M:%SZ\")" \
          -o "build/${BINARY_NAME}" \
          cmd/gopca-cli/main.go
        
        echo "BINARY_NAME=${BINARY_NAME}" >> $GITHUB_ENV
    
    - name: Sign pca CLI binary (macOS)
      if: matrix.goos == 'darwin'
      env:
        APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
      run: |
        ./scripts/ci/sign-macos-ci.sh "build/${{ env.BINARY_NAME }}"
    
    - name: Notarize pca CLI binary (macOS)
      if: matrix.goos == 'darwin'
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        ./scripts/ci/notarize-macos-ci.sh "build/${{ env.BINARY_NAME }}"
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: pca-${{ matrix.goos }}-${{ matrix.goarch }}
        path: build/${{ env.BINARY_NAME }}
        retention-days: 1

  build-desktop:
    name: Build GoPCA Desktop - ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: darwin
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: package-lock.json
    
    - name: Install Wails
      # Pinned to the library version in go.mod. The CLI and the library are
      # separate things and the CLI rewrites go.mod to match itself, so an
      # unpinned CLI would build releases against a version nobody chose.
      run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
    
    - name: Install Linux dependencies
      if: matrix.os == 'ubuntu-latest'
      run: ./scripts/ci/install-linux-deps.sh
    
    - name: Install all dependencies (monorepo)
      run: |
        npm ci
    
    - name: Build shared UI components
      run: |
        npm run build-ui
    
    - name: Get version from tag or input
      id: get_version
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.test_version }}"
          echo "Using test version: $VERSION"
        else
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "Using tag version: $VERSION"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
    
    - name: Build GoPCA Desktop
      working-directory: cmd/gopca-desktop
      env:
        VERSION: ${{ steps.get_version.outputs.version }}
      shell: bash
      run: |
        export PATH=$PATH:$(go env GOPATH)/bin
        wails build -platform ${{ matrix.platform }} -ldflags "-s -w \
          -X github.com/bitjungle/gopca/internal/version.Version=${VERSION} \
          -X github.com/bitjungle/gopca/internal/version.GitCommit=$(git rev-parse --short HEAD) \
          -X github.com/bitjungle/gopca/internal/version.BuildDate=$(date -u +\"%Y-%m-%dT%H:%M:%SZ\")"
    
    - name: Sign GoPCA Desktop (macOS)
      if: matrix.os == 'macos-latest'
      env:
        APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
      run: |
        ./scripts/ci/sign-macos-ci.sh cmd/gopca-desktop/build/bin/GoPCA.app
    
    - name: Notarize GoPCA Desktop (macOS)
      if: matrix.os == 'macos-latest'
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        ./scripts/ci/notarize-macos-ci.sh cmd/gopca-desktop/build/bin/GoPCA.app
    
    - name: Package macOS app for artifact upload
      if: matrix.os == 'macos-latest'
      run: |
        cd cmd/gopca-desktop/build/bin
        # Use tar to preserve symlinks and attributes
        tar -czf GoPCA.app.tar.gz GoPCA.app
        cd -
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: gopca-desktop-${{ matrix.os }}
        path: |
          cmd/gopca-desktop/build/bin/GoPCA.app.tar.gz
          cmd/gopca-desktop/build/bin/GoPCA.exe
          cmd/gopca-desktop/build/bin/GoPCA
        retention-days: 1

  build-gocsv:
    name: Build GoCSV Desktop - ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: darwin
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: package-lock.json
    
    - name: Install Wails
      # Pinned to the library version in go.mod. The CLI and the library are
      # separate things and the CLI rewrites go.mod to match itself, so an
      # unpinned CLI would build releases against a version nobody chose.
      run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
    
    - name: Install Linux dependencies
      if: matrix.os == 'ubuntu-latest'
      run: ./scripts/ci/install-linux-deps.sh
    
    - name: Install all dependencies (monorepo)
      run: |
        npm ci
    
    - name: Build shared UI components
      run: |
        npm run build-ui
    
    - name: Get version from tag or input
      id: get_version
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.test_version }}"
          echo "Using test version: $VERSION"
        else
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "Using tag version: $VERSION"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
    
    - name: Build GoCSV Desktop
      working-directory: cmd/gocsv
      env:
        VERSION: ${{ steps.get_version.outputs.version }}
      shell: bash
      run: |
        export PATH=$PATH:$(go env GOPATH)/bin
        wails build -platform ${{ matrix.platform }} -ldflags "-s -w \
          -X github.com/bitjungle/gopca/internal/version.Version=${VERSION} \
          -X github.com/bitjungle/gopca/internal/version.GitCommit=$(git rev-parse --short HEAD) \
          -X github.com/bitjungle/gopca/internal/version.BuildDate=$(date -u +\"%Y-%m-%dT%H:%M:%SZ\")"
    
    - name: Sign GoCSV Desktop (macOS)
      if: matrix.os == 'macos-latest'
      env:
        APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
      run: |
        ./scripts/ci/sign-macos-ci.sh cmd/gocsv/build/bin/GoCSV.app
    
    - name: Notarize GoCSV Desktop (macOS)
      if: matrix.os == 'macos-latest'
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        ./scripts/ci/notarize-macos-ci.sh cmd/gocsv/build/bin/GoCSV.app
    
    - name: Package macOS GoCSV Desktop for artifact upload
      if: matrix.os == 'macos-latest'
      run: |
        cd cmd/gocsv/build/bin
        # Use tar to preserve symlinks and attributes
        tar -czf GoCSV.app.tar.gz GoCSV.app
        cd -
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: gocsv-${{ matrix.os }}
        path: |
          cmd/gocsv/build/bin/GoCSV.app.tar.gz
          cmd/gocsv/build/bin/GoCSV.exe
          cmd/gocsv/build/bin/GoCSV
        retention-days: 1

  build-appimages:
    name: Build AppImages
    runs-on: self-hosted
    needs: [build-desktop, build-gocsv]
    if: always() && !cancelled()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download GoPCA Desktop Linux binary
      uses: actions/download-artifact@v4
      with:
        name: gopca-desktop-ubuntu-latest
        path: gopca-desktop-ubuntu-latest
    
    - name: Download GoCSV Desktop Linux binary
      uses: actions/download-artifact@v4
      with:
        name: gocsv-ubuntu-latest
        path: gocsv-ubuntu-latest
    
    - name: Build AppImages
      run: |
        echo "Building AppImages on self-hosted runner with FUSE support..."
        
        # Download appimagetool
        curl -L -o appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x appimagetool
        
        # Build GoPCA AppImage if binary exists
        if [ -f "gopca-desktop-ubuntu-latest/GoPCA" ]; then
          echo "Building GoPCA AppImage..."
          # Prepare appdir structure
          mkdir -p appdir-gopca/usr/bin
          mkdir -p appdir-gopca/usr/share/icons/hicolor/256x256/apps
          
          # Copy files from repository
          cp gopca-desktop-ubuntu-latest/GoPCA appdir-gopca/usr/bin/
          chmod +x appdir-gopca/usr/bin/GoPCA
          
          # Create AppRun script
          printf '#!/bin/bash\nHERE="$(dirname "$(readlink -f "${0}")")"\nexec "${HERE}/usr/bin/GoPCA" "$@"\n' > appdir-gopca/AppRun
          chmod +x appdir-gopca/AppRun
          
          # Create desktop file using printf
          printf '%s\n' \
            '[Desktop Entry]' \
            'Version=1.0' \
            'Type=Application' \
            'Name=GoPCA' \
            'GenericName=PCA Analysis Tool' \
            'Comment=Professional Principal Component Analysis Tool' \
            'Exec=GoPCA %f' \
            'Icon=gopca' \
            'Terminal=false' \
            'Categories=Science;Math;Education;DataVisualization;' \
            'MimeType=text/csv;text/plain;' \
            'StartupNotify=true' \
            > appdir-gopca/gopca.desktop
          
          # Download icon from repository
          curl -L -o appdir-gopca/gopca.png https://raw.githubusercontent.com/${{ github.repository }}/main/cmd/gopca-desktop/build/linux/icon-256.png
          cp appdir-gopca/gopca.png appdir-gopca/usr/share/icons/hicolor/256x256/apps/
          
          # Build AppImage
          ARCH=x86_64 ./appimagetool appdir-gopca GoPCA-x86_64.AppImage
          echo "✓ GoPCA AppImage built successfully"
        else
          echo "⚠️ GoPCA binary not found, skipping AppImage build"
        fi
        
        # Build GoCSV AppImage if binary exists
        if [ -f "gocsv-ubuntu-latest/GoCSV" ]; then
          echo "Building GoCSV AppImage..."
          # Prepare appdir structure
          mkdir -p appdir-gocsv/usr/bin
          mkdir -p appdir-gocsv/usr/share/icons/hicolor/256x256/apps
          
          # Copy files from repository
          cp gocsv-ubuntu-latest/GoCSV appdir-gocsv/usr/bin/
          chmod +x appdir-gocsv/usr/bin/GoCSV
          
          # Create AppRun script
          printf '#!/bin/bash\nHERE="$(dirname "$(readlink -f "${0}")")"\nexec "${HERE}/usr/bin/GoCSV" "$@"\n' > appdir-gocsv/AppRun
          chmod +x appdir-gocsv/AppRun
          
          # Create desktop file using printf
          printf '%s\n' \
            '[Desktop Entry]' \
            'Version=1.0' \
            'Type=Application' \
            'Name=GoCSV' \
            'GenericName=CSV Editor' \
            'Comment=Fast and Efficient CSV Data Editor' \
            'Exec=GoCSV %f' \
            'Icon=gocsv' \
            'Terminal=false' \
            'Categories=Office;Spreadsheet;Science;DataVisualization;' \
            'MimeType=text/csv;text/plain;text/tab-separated-values;' \
            'StartupNotify=true' \
            > appdir-gocsv/gocsv.desktop
          
          # Download icon from repository
          curl -L -o appdir-gocsv/gocsv.png https://raw.githubusercontent.com/${{ github.repository }}/main/cmd/gocsv/build/linux/icon-256.png
          cp appdir-gocsv/gocsv.png appdir-gocsv/usr/share/icons/hicolor/256x256/apps/
          
          # Build AppImage
          ARCH=x86_64 ./appimagetool appdir-gocsv GoCSV-x86_64.AppImage
          echo "✓ GoCSV AppImage built successfully"
        else
          echo "⚠️ GoCSV binary not found, skipping AppImage build"
        fi
        
        # List created AppImages
        if ls *.AppImage 1> /dev/null 2>&1; then
          echo "=== AppImages created ==="
          ls -lh *.AppImage
        else
          echo "⚠️ No AppImages were created"
        fi
    
    - name: Upload AppImage artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-appimages
        path: |
          *.AppImage
        retention-days: 1
        if-no-files-found: ignore

  build-msix:
    name: Build Bundled MSIX Package
    runs-on: windows-latest
    needs: [build-desktop, build-gocsv]
    if: always() && !cancelled()

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get version from tag or input
      id: get_version
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.test_version }}"
          echo "Using test version: $VERSION"
        else
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "Using tag version: $VERSION"
        fi
        # Strip 'v' prefix for MSIX version
        VERSION_NO_V="${VERSION#v}"
        # Strip pre-release suffix (e.g., -msix-test2, -alpha, -beta) for MSIX
        # MSIX versions must be strictly numeric: major.minor.patch.build
        MSIX_VERSION=$(echo "$VERSION_NO_V" | sed -E 's/-.*$//')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "version_no_v=$VERSION_NO_V" >> $GITHUB_OUTPUT
        echo "msix_version=$MSIX_VERSION" >> $GITHUB_OUTPUT
        echo "MSIX version will be: $MSIX_VERSION"

    - name: Download Windows GoPCA artifact
      uses: actions/download-artifact@v4
      with:
        name: gopca-desktop-windows-latest
        path: windows-desktop

    - name: Download Windows GoCSV artifact
      uses: actions/download-artifact@v4
      with:
        name: gocsv-windows-latest
        path: windows-gocsv

    - name: Prepare executables for MSIX
      shell: bash
      run: |
        mkdir -p msix-build

        # Prepare GoPCA.exe
        if [ -f "windows-desktop/GoPCA.exe" ]; then
          cp windows-desktop/GoPCA.exe msix-build/GoPCA.exe
        elif [ -f "windows-desktop/GoPCA-amd64.exe" ]; then
          cp windows-desktop/GoPCA-amd64.exe msix-build/GoPCA.exe
        else
          echo "ERROR: No GoPCA.exe found!"
          ls -la windows-desktop/
          exit 1
        fi

        # Prepare GoCSV.exe
        if [ -f "windows-gocsv/GoCSV.exe" ]; then
          cp windows-gocsv/GoCSV.exe msix-build/GoCSV.exe
        elif [ -f "windows-gocsv/GoCSV-amd64.exe" ]; then
          cp windows-gocsv/GoCSV-amd64.exe msix-build/GoCSV.exe
        else
          echo "ERROR: No GoCSV.exe found!"
          ls -la windows-gocsv/
          exit 1
        fi

        echo "=== Executables prepared for MSIX ==="
        ls -lh msix-build/*.exe

    - name: Generate AppxManifest.xml
      shell: bash
      run: |
        # Construct publisher string (add CN= prefix)
        PUBLISHER="CN=${{ secrets.MS_WINDOWS_PUBLISHER_ID }}"

        # Use cleaned MSIX version (pre-release suffix already stripped)
        MSIX_VERSION="${{ steps.get_version.outputs.msix_version }}.0"

        echo "Generating bundled MSIX package manifest"
        echo "  Version: $MSIX_VERSION"
        echo "  Publisher: $PUBLISHER"
        echo "  Apps: GoPCA Desktop + GoCSV Desktop"

        # Create package structure
        mkdir -p msix-build/package/Assets

        # Copy GoPCA Assets
        echo "Copying GoPCA assets..."
        cp cmd/gopca-desktop/Assets/*.png msix-build/package/Assets/

        # Copy GoCSV Assets
        echo "Copying GoCSV assets..."
        if [ -d "cmd/gocsv/Assets" ]; then
          cp cmd/gocsv/Assets/*.png msix-build/package/Assets/
        else
          echo "ERROR: GoCSV Assets directory not found!"
          echo "Expected location: cmd/gocsv/Assets/"
          echo "See cmd/gocsv/Assets/README.md for asset requirements"
          exit 1
        fi

        # Copy both executables
        echo "Copying executables..."
        cp msix-build/GoPCA.exe msix-build/package/
        cp msix-build/GoCSV.exe msix-build/package/

        # Generate manifest from template (now includes both apps)
        sed -e "s|{{VERSION}}|${MSIX_VERSION}|g" \
            -e "s|{{PUBLISHER}}|${PUBLISHER}|g" \
            cmd/gopca-desktop/AppxManifest.template.xml > msix-build/package/AppxManifest.xml

        # Verify substitutions
        echo "Verifying manifest..."
        if ! grep -q "$MSIX_VERSION" msix-build/package/AppxManifest.xml; then
          echo "ERROR: Version not substituted correctly"
          exit 1
        fi

        if ! grep -q "$PUBLISHER" msix-build/package/AppxManifest.xml; then
          echo "ERROR: Publisher not substituted correctly"
          exit 1
        fi

        # Verify both applications are in manifest
        if ! grep -q 'Id="GoPCA"' msix-build/package/AppxManifest.xml; then
          echo "ERROR: GoPCA application not found in manifest"
          exit 1
        fi

        if ! grep -q 'Id="GoCSV"' msix-build/package/AppxManifest.xml; then
          echo "ERROR: GoCSV application not found in manifest"
          exit 1
        fi

        echo "✓ Bundled manifest generated successfully"
        echo "Package contents:"
        ls -la msix-build/package/
        ls -la msix-build/package/Assets/

    - name: Build MSIX package
      shell: powershell
      run: |
        $MSIX_VERSION = "${{ steps.get_version.outputs.msix_version }}.0"

        Write-Host "Building MSIX package for version $MSIX_VERSION"

        # Find MakeAppx.exe dynamically
        $sdkPath = "C:\Program Files (x86)\Windows Kits\10\bin"
        if (Test-Path $sdkPath) {
          $sdkVersions = Get-ChildItem $sdkPath -Directory | Sort-Object Name -Descending
          $makeAppxPath = $null

          foreach ($version in $sdkVersions) {
            $candidate = Join-Path $version.FullName "x64\MakeAppx.exe"
            if (Test-Path $candidate) {
              $makeAppxPath = $candidate
              Write-Host "Found MakeAppx.exe: $makeAppxPath"
              break
            }
          }

          if (-not $makeAppxPath) {
            Write-Host "ERROR: MakeAppx.exe not found in any SDK version"
            exit 1
          }
        } else {
          Write-Host "ERROR: Windows SDK not found at $sdkPath"
          exit 1
        }

        # Build MSIX package
        $packageDir = "msix-build\package"
        $outputFile = "msix-build\GoPCA_${MSIX_VERSION}_x64.msix"

        & $makeAppxPath pack /v /h SHA256 /d $packageDir /p $outputFile

        if ($LASTEXITCODE -ne 0) {
          Write-Host "ERROR: MakeAppx.exe failed with exit code $LASTEXITCODE"
          exit 1
        }

        Write-Host "MSIX package created successfully"
        Get-ChildItem msix-build\*.msix

    - name: Sign MSIX package
      shell: powershell
      run: |
        $MSIX_VERSION = "${{ steps.get_version.outputs.msix_version }}.0"
        $MSIX_FILE = "msix-build\GoPCA_${MSIX_VERSION}_x64.msix"

        Write-Host "Creating self-signed certificate for MSIX (Store will re-sign)"

        # Create test certificate for MSIX packaging
        $cert = New-SelfSignedCertificate -Type Custom `
          -Subject "CN=${{ secrets.MS_WINDOWS_PUBLISHER_ID }}" `
          -KeyUsage DigitalSignature `
          -FriendlyName "GoPCA MSIX Test" `
          -CertStoreLocation "Cert:\CurrentUser\My" `
          -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")

        Export-PfxCertificate -Cert $cert -FilePath msix-cert.pfx `
          -Password (ConvertTo-SecureString -String "test" -Force -AsPlainText)

        # Find SignTool.exe dynamically
        $sdkPath = "C:\Program Files (x86)\Windows Kits\10\bin"
        if (Test-Path $sdkPath) {
          $sdkVersions = Get-ChildItem $sdkPath -Directory | Sort-Object Name -Descending
          $signToolPath = $null

          foreach ($version in $sdkVersions) {
            $candidate = Join-Path $version.FullName "x64\SignTool.exe"
            if (Test-Path $candidate) {
              $signToolPath = $candidate
              Write-Host "Found SignTool.exe: $signToolPath"
              break
            }
          }

          if (-not $signToolPath) {
            Write-Host "WARNING: SignTool.exe not found, MSIX will be unsigned"
            Write-Host "This is OK - Microsoft Store will re-sign the package"
            exit 0
          }
        } else {
          Write-Host "WARNING: Windows SDK not found, MSIX will be unsigned"
          Write-Host "This is OK - Microsoft Store will re-sign the package"
          exit 0
        }

        # Sign MSIX package
        Write-Host "Signing MSIX package with test certificate"
        & $signToolPath sign /fd SHA256 /a /f msix-cert.pfx /p test $MSIX_FILE

        if ($LASTEXITCODE -ne 0) {
          Write-Host "WARNING: SignTool failed, MSIX may be unsigned"
          Write-Host "This is OK - Microsoft Store will re-sign the package"
        } else {
          Write-Host "MSIX package signed successfully with test certificate"

          # Verify signature (will fail for self-signed cert, but shows it's signed)
          Write-Host "Verifying MSIX signature"
          & $signToolPath verify /pa $MSIX_FILE
          if ($LASTEXITCODE -ne 0) {
            Write-Host "NOTE: Verification failed (expected for self-signed certificate)"
            Write-Host "The package IS signed, but the certificate is not trusted"
            Write-Host "Microsoft Store will re-sign with a trusted certificate"
          } else {
            Write-Host "Signature verified successfully"
          }
        }

        # Clean up certificate
        Remove-Item msix-cert.pfx -ErrorAction SilentlyContinue

        # Ensure we don't fail the job on expected verification error
        exit 0

    - name: Upload MSIX artifact
      uses: actions/upload-artifact@v4
      with:
        name: msix-package
        path: msix-build/GoPCA_*.msix
        retention-days: 1

  build-windows-installer:
    name: Build Windows Installer
    runs-on: self-hosted
    needs: [build-cli-binaries, build-desktop, build-gocsv]
    if: always() && !cancelled()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Get version from tag or input
      id: get_version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.test_version }}"
          echo "Using test version: $VERSION"
        else
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "Using tag version: $VERSION"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
    
    - name: Download Windows CLI artifact
      uses: actions/download-artifact@v4
      with:
        name: pca-windows-amd64
        path: windows-cli
    
    - name: Download Windows GoPCA artifact
      uses: actions/download-artifact@v4
      with:
        name: gopca-desktop-windows-latest
        path: windows-desktop

    - name: Download Windows GoCSV artifact
      uses: actions/download-artifact@v4
      with:
        name: gocsv-windows-latest
        path: windows-gocsv

    - name: Prepare binaries for installer
      run: |
        mkdir -p build/windows-installer

        # Copy pca CLI binary
        cp windows-cli/pca-windows-amd64.exe build/windows-installer/pca-windows-amd64.exe

        # Copy GoPCA Desktop (handle both naming conventions)
        if [ -f "windows-desktop/GoPCA-amd64.exe" ]; then
          cp windows-desktop/GoPCA-amd64.exe build/windows-installer/GoPCA.exe
        elif [ -f "windows-desktop/GoPCA.exe" ]; then
          cp windows-desktop/GoPCA.exe build/windows-installer/GoPCA.exe
        else
          echo "ERROR: No GoPCA.exe found!"
          ls -la windows-desktop/
          exit 1
        fi

        # Copy GoCSV Desktop (handle both naming conventions)
        if [ -f "windows-gocsv/GoCSV-amd64.exe" ]; then
          cp windows-gocsv/GoCSV-amd64.exe build/windows-installer/GoCSV.exe
        elif [ -f "windows-gocsv/GoCSV.exe" ]; then
          cp windows-gocsv/GoCSV.exe build/windows-installer/GoCSV.exe
        else
          echo "ERROR: No GoCSV.exe found!"
          ls -la windows-gocsv/
          exit 1
        fi

        echo "=== Installer binaries prepared ==="
        ls -lh build/windows-installer/
    
    - name: Build Windows installer
      run: |
        VERSION="${{ steps.get_version.outputs.version }}"
        echo "Building Windows installer for version ${VERSION}..."
        
        # Strip the 'v' prefix for NSIS (installer.nsi adds it back)
        VERSION_NO_V="${VERSION#v}"
        echo "Version for NSIS: ${VERSION_NO_V}"
        
        # Build the installer using NSIS
        cd scripts/windows
        makensis -V2 -DVERSION=${VERSION_NO_V} installer.nsi
        
        # Check if installer was created
        INSTALLER_PATH="../../build/windows-installer/GoPCA-Setup-${VERSION}.exe"
        if [ -f "${INSTALLER_PATH}" ]; then
          echo "✓ Installer created successfully: ${INSTALLER_PATH}"
          ls -lh "${INSTALLER_PATH}"
        else
          echo "ERROR: Installer was not created!"
          exit 1
        fi
    
    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-installer
        path: build/windows-installer/GoPCA-Setup-*.exe
        retention-days: 1

  create-release:
    name: Create Release with Artifacts
    runs-on: ubuntu-latest
    needs: [build-cli-binaries, build-desktop, build-gocsv, build-appimages, build-windows-installer, build-msix]
    if: always() && !cancelled()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Extract and restore macOS apps
      run: |
        # Extract macOS apps from tarballs (preserves symlinks and attributes)
        if [ -f "artifacts/gopca-desktop-macos-latest/GoPCA.app.tar.gz" ]; then
          echo "Extracting GoPCA.app from tarball..."
          cd artifacts/gopca-desktop-macos-latest
          tar -xzf GoPCA.app.tar.gz
          rm GoPCA.app.tar.gz
          cd ../..
          echo "✓ Extracted GoPCA.app with preserved symlinks"
        fi
        
        if [ -f "artifacts/gocsv-macos-latest/GoCSV.app.tar.gz" ]; then
          echo "Extracting GoCSV.app from tarball..."
          cd artifacts/gocsv-macos-latest
          tar -xzf GoCSV.app.tar.gz
          rm GoCSV.app.tar.gz
          cd ../..
          echo "✓ Extracted GoCSV.app with preserved symlinks"
        fi
        
        # Restore permissions for CLI binaries
        if [ -f "artifacts/pca-darwin-amd64/pca-darwin-amd64" ]; then
          chmod +x "artifacts/pca-darwin-amd64/pca-darwin-amd64"
        fi
        
        if [ -f "artifacts/pca-darwin-arm64/pca-darwin-arm64" ]; then
          chmod +x "artifacts/pca-darwin-arm64/pca-darwin-arm64"
        fi
    
    - name: Organize and package artifacts
      run: |
        cd artifacts
        
        # Check for Windows installer
        INSTALLER_AVAILABLE="false"
        if [ -d "windows-installer" ] && ls windows-installer/GoPCA-Setup-*.exe 1> /dev/null 2>&1; then
          INSTALLER_AVAILABLE="true"
          echo "✓ Windows installer found"
          ls -lh windows-installer/GoPCA-Setup-*.exe
        else
          echo "⚠️ Windows installer not found (NSIS not available on runner)"
        fi
        echo "INSTALLER_AVAILABLE=${INSTALLER_AVAILABLE}" >> $GITHUB_ENV
        
        # Create directories for platform bundles
        mkdir -p macos windows linux
        
        # === macOS Bundle (Intel and ARM) ===
        echo "Creating macOS bundle..."
        
        # CLI binaries - both architectures
        if [ -f "pca-darwin-amd64/pca-darwin-amd64" ]; then
          cp "pca-darwin-amd64/pca-darwin-amd64" "macos/pca-intel"
        fi
        if [ -f "pca-darwin-arm64/pca-darwin-arm64" ]; then
          cp "pca-darwin-arm64/pca-darwin-arm64" "macos/pca-arm64"
        fi
        
        # GoPCA Desktop (use cp -a to preserve permissions and symlinks)
        if [ -d "gopca-desktop-macos-latest/GoPCA.app" ]; then
          cp -a "gopca-desktop-macos-latest/GoPCA.app" "macos/"
        fi
        
        # GoCSV Desktop (use cp -a to preserve permissions and symlinks)
        if [ -d "gocsv-macos-latest/GoCSV.app" ]; then
          cp -a "gocsv-macos-latest/GoCSV.app" "macos/"
        fi
        
        # Create macOS bundle zip (preserve symlinks with -y flag)
        cd macos
        zip -r -y ../gopca-macos-universal.zip .
        cd ..
        
        # === Windows Bundle ===
        echo "Creating Windows bundle..."
        
        # CLI binary
        if [ -f "pca-windows-amd64/pca-windows-amd64.exe" ]; then
          cp "pca-windows-amd64/pca-windows-amd64.exe" "windows/pca.exe"
        fi

        # GoPCA app
        if [ -f "gopca-desktop-windows-latest/GoPCA.exe" ]; then
          cp "gopca-desktop-windows-latest/GoPCA.exe" "windows/GoPCA.exe"
        fi

        # GoCSV app
        if [ -f "gocsv-windows-latest/GoCSV.exe" ]; then
          cp "gocsv-windows-latest/GoCSV.exe" "windows/GoCSV.exe"
        fi
        
        # Create Windows bundle zip
        cd windows
        zip -r ../gopca-windows-x64.zip .
        cd ..
        
        # === Linux Bundle (x64 and ARM64) ===
        echo "Creating Linux bundle..."
        
        # CLI binaries - both architectures
        if [ -f "pca-linux-amd64/pca-linux-amd64" ]; then
          cp "pca-linux-amd64/pca-linux-amd64" "linux/pca-x64"
        fi
        if [ -f "pca-linux-arm64/pca-linux-arm64" ]; then
          cp "pca-linux-arm64/pca-linux-arm64" "linux/pca-arm64"
        fi
        
        # GoPCA app
        if [ -f "gopca-desktop-ubuntu-latest/GoPCA" ]; then
          cp "gopca-desktop-ubuntu-latest/GoPCA" "linux/GoPCA"
        fi
        
        # GoCSV app
        if [ -f "gocsv-ubuntu-latest/GoCSV" ]; then
          cp "gocsv-ubuntu-latest/GoCSV" "linux/GoCSV"
        fi
        
        # Create Linux bundle tar.gz
        cd linux
        tar -czf ../gopca-linux-x64.tar.gz .
        cd ..
        
        # Download AppImages from build-appimages job if available
        if [ -d "linux-appimages" ]; then
          echo "AppImages found from build-appimages job"
          if ls linux-appimages/*.AppImage 1> /dev/null 2>&1; then
            cp linux-appimages/*.AppImage .
            echo "✓ AppImages copied from build artifacts"
            ls -lh *.AppImage
          else
            echo "⚠️ No AppImages found in artifacts"
          fi
        else
          echo "⚠️ No AppImages artifacts found (build may have been skipped or failed)"
        fi
        
        # Move Windows installer to artifacts root if available
        if [ "${INSTALLER_AVAILABLE}" = "true" ]; then
          mv windows-installer/GoPCA-Setup-*.exe .
        fi

        # Copy MSIX package if available
        if [ -d "msix-package" ] && ls msix-package/*.msix 1> /dev/null 2>&1; then
          echo "✓ MSIX package found"
          cp msix-package/*.msix .
          echo "MSIX package copied:"
          ls -lh *.msix
        else
          echo "⚠️ No MSIX package found (build may have failed)"
        fi

        # Clean up temporary directories
        rm -rf macos windows linux
        rm -rf pca-* gopca-desktop-* gocsv-* windows-installer msix-package

        # Generate checksums for all artifacts (including AppImages and MSIX if built)
        if [ "${INSTALLER_AVAILABLE}" = "true" ]; then
          shasum -a 256 gopca-*.zip gopca-*.tar.gz *.AppImage *.msix GoPCA-Setup-*.exe 2>/dev/null > checksums.txt || \
          shasum -a 256 gopca-*.zip gopca-*.tar.gz *.msix GoPCA-Setup-*.exe 2>/dev/null > checksums.txt || \
          shasum -a 256 gopca-*.zip gopca-*.tar.gz GoPCA-Setup-*.exe > checksums.txt
        else
          shasum -a 256 gopca-*.zip gopca-*.tar.gz *.AppImage *.msix 2>/dev/null > checksums.txt || \
          shasum -a 256 gopca-*.zip gopca-*.tar.gz *.msix 2>/dev/null > checksums.txt || \
          shasum -a 256 gopca-*.zip gopca-*.tar.gz > checksums.txt
        fi
        
        # List final artifacts
        echo "=== Final release artifacts ==="
        ls -lh gopca-*.zip gopca-*.tar.gz *.AppImage *.msix GoPCA-Setup-*.exe checksums.txt 2>/dev/null || \
        ls -lh gopca-*.zip gopca-*.tar.gz *.msix checksums.txt 2>/dev/null || \
        ls -lh gopca-*.zip gopca-*.tar.gz checksums.txt 2>/dev/null
        echo "==============================="
    
    - name: Upload test artifacts for workflow_dispatch
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: release-bundles
        path: |
          artifacts/gopca-macos-universal.zip
          artifacts/gopca-windows-x64.zip
          artifacts/gopca-linux-x64.tar.gz
          artifacts/*.AppImage
          artifacts/*.msix
          artifacts/checksums.txt
        retention-days: 7
    
    - name: Test Mode Notification
      if: github.event_name == 'workflow_dispatch'
      run: |
        echo "=========================================="
        echo "🧪 TEST MODE - No release will be created"
        echo "=========================================="
        echo "This workflow run was triggered manually for testing."
        echo "Version used: ${{ github.event.inputs.test_version }}"
        echo ""
        echo "Artifacts have been built and can be downloaded from:"
        echo "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        echo ""
        echo "Download the 'release-bundles' artifact to test the macOS bundle."
        echo "The gopca-macos-universal.zip contains both apps with preserved symlinks."
        echo ""
        echo "To create an actual release, push a version tag (e.g., v0.9.5)"
        echo "=========================================="
    
    - name: Generate release body with changelog
      if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
      id: release_body
      run: |
        # Extract the changelog content for this version
        VERSION="${GITHUB_REF#refs/tags/}"
        VERSION_NO_V="${VERSION#v}"
        echo "Extracting changelog for version: $VERSION"

        # Use the extraction script
        CHANGELOG_CONTENT=$(./scripts/extract-changelog.sh "$VERSION")

        # If no changelog content found, use a default message
        if [ -z "$CHANGELOG_CONTENT" ]; then
          CHANGELOG_CONTENT="See CHANGELOG.md for details about this release."
        fi

        # Create the release body with changelog and download instructions
        cat > release_body.md << EOF
        ## What's Changed in ${VERSION}

        ${CHANGELOG_CONTENT}

        ---

        ## Downloads

        Download the complete bundle for your platform. Each bundle contains:
        - **PCA CLI**: Command-line tool for scripting and automation
        - **GoPCA Desktop**: GUI application for interactive PCA analysis
        - **GoCSV**: Data preparation and CSV editing tool

        ### Platform Bundles

        | Platform | Download | Contents |
        |----------|----------|----------|
        | **macOS** | [\`gopca-macos-universal.zip\`](../../releases/download/${VERSION}/gopca-macos-universal.zip) | • \`pca-intel\` and \`pca-arm64\` CLI tools<br>• \`GoPCA.app\` (signed & notarized)<br>• \`GoCSV.app\` (signed & notarized) |
        | **Windows** | [\`gopca-windows-x64.zip\`](../../releases/download/${VERSION}/gopca-windows-x64.zip) | • \`pca.exe\` CLI tool<br>• \`GoPCA.exe\`<br>• \`GoCSV.exe\`<br>• ⚠️ Unsigned executables — SmartScreen warning expected<br>• 👉 [Install from Microsoft Store](https://apps.microsoft.com/detail/9n8hcxgrjzt5) to avoid warnings |
        | **Linux** | [\`gopca-linux-x64.tar.gz\`](../../releases/download/${VERSION}/gopca-linux-x64.tar.gz) | • \`pca-x64\` and \`pca-arm64\` CLI tools<br>• \`GoPCA\` app<br>• \`GoCSV\` editor |

        ### Linux AppImages (Recommended for Linux desktop users)

        AppImages are portable, single-file applications that work on all Linux distributions. They include proper icon support and require no installation.

        | Application | Download | Description |
        |------------|----------|-------------|
        | **GoPCA Desktop** | [\`GoPCA-x86_64.AppImage\`](../../releases/download/${VERSION}/GoPCA-x86_64.AppImage) | PCA analysis GUI with full icon support<br>• Download and make executable: \`chmod +x\`<br>• Double-click to run |
        | **GoCSV Editor** | [\`GoCSV-x86_64.AppImage\`](../../releases/download/${VERSION}/GoCSV-x86_64.AppImage) | CSV data preparation tool with full icon support<br>• Download and make executable: \`chmod +x\`<br>• Double-click to run |

        ### Windows Installation (Recommended: Microsoft Store)

        > **Windows users:** The easiest and most secure way to install GoPCA on Windows is through the **Microsoft Store** — no security warnings, automatic updates, and clean uninstallation.
        >
        > 🛒 **[Get GoPCA on Microsoft Store](https://apps.microsoft.com/detail/9n8hcxgrjzt5)**
        >
        > _(The latest version will appear in the Store shortly after each release)_

        **Alternative: Windows Installer** (for offline installs or users who prefer a traditional setup)

        | Installer | Download | Notes |
        |-----------|----------|-------|
        | **Windows Setup** | [\`GoPCA-Setup-${VERSION}.exe\`](../../releases/download/${VERSION}/GoPCA-Setup-${VERSION}.exe) | Includes GoPCA Desktop, GoCSV, and pca CLI<br>• Start Menu shortcuts and optional PATH setup<br>• ⚠️ Not digitally signed — Windows may show a SmartScreen warning<br>• Click "More info" → "Run anyway" to proceed |

        ### Microsoft Store Package (MSIX — for IT admins / sideloading)

        | Package | Download | Description |
        |---------|----------|-------------|
        | **MSIX Package** | [\`GoPCA_${VERSION_NO_V}.0_x64.msix\`](../../releases/download/${VERSION}/GoPCA_${VERSION_NO_V}.0_x64.msix) | For enterprise deployment (Intune/SCCM) or sideloading<br>• Self-signed during build; Microsoft Store re-signs on publish<br>• Most users should install from the Store link above |

        ### Installation

        1. Download the bundle for your platform
        2. Extract the archive to your preferred location
        3. Add the directory to your PATH for CLI access (optional)

        ### Verification

        SHA-256 checksums: [\`checksums.txt\`](../../releases/download/${VERSION}/checksums.txt)

        ⚠️ **Windows executables are not digitally signed** — install from the [Microsoft Store](https://apps.microsoft.com/detail/9n8hcxgrjzt5) for a warning-free experience.

        ---

        **Full Changelog**: https://github.com/bitjungle/gopca/blob/main/CHANGELOG.md
        EOF

        echo "✓ Release body generated with changelog"

    # Runs immediately before the release is created, and checks the same
    # variable the step below passes to the action -- so it cannot pass while
    # the release goes somewhere else.
    - name: Guard - a release must never be created in the source repository
      if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
      env:
        TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
      run: |
        set -euo pipefail

        # GitHub generates "Source code (zip)" and "Source code (tar.gz)" for
        # every release, built from the tag in the repository that HOSTS the
        # release. They are not assets: there is no delete endpoint for them,
        # because nothing is stored -- they are rendered from the tag on
        # request, and the only way to remove them is to delete the tag.
        #
        # In the public distribution repository the tag has no source, so those
        # archives contain documentation and schemas. Created HERE they would
        # contain the complete GoPCA source, labelled "Source code", one
        # visibility mistake away from publication. That asymmetry is the whole
        # reason releases are published to another repository, so it is checked
        # rather than remembered.
        if [ "${PUBLIC_RELEASE_REPO}" = "${GITHUB_REPOSITORY}" ]; then
          echo "::error::Refusing to create a release in ${GITHUB_REPOSITORY}."
          echo "::error::PUBLIC_RELEASE_REPO must name the public distribution"
          echo "::error::repository, not the repository holding the source."
          exit 1
        fi

        if [ -z "${TOKEN}" ]; then
          echo "::error::PUBLIC_REPO_TOKEN is not set."
          echo "::error::Create a fine-grained PAT with Contents: write scoped"
          echo "::error::to ${PUBLIC_RELEASE_REPO} only, and add it as a repository"
          echo "::error::secret named PUBLIC_REPO_TOKEN. Without it the release"
          echo "::error::would fall back to this repository."
          exit 1
        fi

        echo "Publishing the release to ${PUBLIC_RELEASE_REPO}"
        echo "Source archives there are generated from a tag with no source in it."

    - name: Create Release
      if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        repository: ${{ env.PUBLIC_RELEASE_REPO }}
        token: ${{ secrets.PUBLIC_REPO_TOKEN }}
        files: |
          artifacts/gopca-macos-universal.zip
          artifacts/gopca-windows-x64.zip
          artifacts/gopca-linux-x64.tar.gz
          artifacts/*.AppImage
          artifacts/*.msix
          artifacts/GoPCA-Setup-*.exe
          artifacts/checksums.txt
        generate_release_notes: false
        fail_on_unmatched_files: false
        body_path: release_body.md